apis:
- aid: superlinked:superlinked-framework
  name: Superlinked Framework (Python)
  tags:
  - Framework
  - Python
  - Embeddings
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/superlinked/superlinked
