  properties:
  - url: https://github.com/superlinked/superlinked
    type: Documentation
  - url: https://github.com/superlinked/superlinked
    type: GitHub
  description: >-
    The open-source Apache-2.0 Python framework (pip install superlinked) used to declare Schema, Space,
    Index, Query, Source, and Executor objects. The same definitions run in-memory for prototyping or
    power the Superlinked Server, which generates the REST API. This is a library/SDK surface, not an
    HTTP API.
- aid: superlinked:superlinked-cloud
  name: Superlinked Cloud
  tags:
  - Cloud
  - Managed
  - Vectors
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.superlinked.com
  baseURL: https://www.superlinked.com
  properties:
  - url: https://www.superlinked.com
    type: Documentation
  description: >-
    Managed, production-scale hosting of Superlinked-powered apps, available in early access via a sales-led
    demo. Runs the same schema-generated REST surface as the self-hosted Superlinked Server without the
    user operating the infrastructure.
